<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Catalina Mena">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="nav">
            <h1>Social Like</h1>
        </nav>
    </header>
    <main class="contenedor-principal">
        <div class="perfil">
            <section class="tarjeta">
                <img class="imagen-perfil" src="static/images/misato.png" alt="Misato">
                <h2>Misato</h2>
                <button class="boton">Mi perfil</button>
            </section>
        </div>

        <section class="meGustas">
            <h2>Últimas publicaciones</h2>
            <div class="publicacion1">
                <div class="texto">
                    <h3>Rei</h3>
                    <p>Acabo de configurar este nuevo <a href="#">bot de Discord</a>, cuéntame que opinan ustedes.</p>
                </div>
                <div class="likes">
                    <p class="contador">0 like(s)</p>
                    <button class="megusta">Like</button>
                </div>
            </div>
            <div class="publicacion2">
                <div class="texto">
                    <h3>Asuka</h3>
                    <p>Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.</p>
                </div>
                <div class="likes">
                    <p class="contador2">0 like(s)</p>
                    <button class="megusta2">Like</button>
                </div>
            </div>
            <div class="publicacion3">
                <div class="texto">
                    <h3>Shinji</h3>
                    <p>No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?</p>
                </div>
                <div class="likes">
                    <p class="contador3">0 like(s)</p>
                    <button class="megusta3">Like</button>
                </div>
            </div>
        </section>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
